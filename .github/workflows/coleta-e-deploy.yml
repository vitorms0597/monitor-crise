name: Coleta e deploy

# Repositório privado e sem GitHub Pages por enquanto: só roda manualmente.
# Para publicar: torne o repo público (ou use GitHub Pro), ative Pages com origem "GitHub Actions",
# descomente o agendamento abaixo e mude a variável de repositório PUBLICAR para "sim".
on:
  # schedule:
  #   - cron: "*/30 * * * *" # o GitHub pode atrasar alguns minutos em horário de pico
  workflow_dispatch:
    inputs:
      backfill_horas:
        description: "Reprocessar as últimas N horas do GDELT (vazio = normal)"
        required: false

concurrency:
  group: coleta
  cancel-in-progress: false

permissions:
  contents: write # grava o branch data
  pages: write
  id-token: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # GitHub Pages: https://<usuário>.github.io/monitor-crise/. Com domínio próprio, defina as variáveis
      # do repositório SITE_URL=https://seudominio.com.br e BASE_PATH=/
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      BASE_PATH: ${{ vars.BASE_PATH || '/monitor-crise' }}
    steps:
      - uses: actions/checkout@v4

      - name: Recupera os dados da última coleta (branch data)
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C data
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27"

      - name: Coleta
        run: |
          ARGS=""
          if [ -n "${{ inputs.backfill_horas }}" ]; then ARGS="--backfill-horas ${{ inputs.backfill_horas }}"; fi
          python -m collector --data-dir data $ARGS

      - name: Salva os dados (branch data, sempre um único commit)
        run: |
          cd data
          git init -q -b data
          git add -A
          git -c user.name="monitor-bot" -c user.email="bot@users.noreply.github.com" commit -qm "dados $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build do site
        working-directory: site
        run: |
          npm ci
          npx astro build

      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLICAR == 'sim'
        with:
          path: site/dist

  publica:
    needs: coleta
    if: vars.PUBLICAR == 'sim'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
